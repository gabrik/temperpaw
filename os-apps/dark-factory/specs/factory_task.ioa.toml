hint = "System-only hard stop: a phase exceeded its time budget (state_timeout) or a module call failed (trigger on_failure). No operation fencing — the timeout cannot know the live key."
effect = [{ type = "trigger", name = "factory_janitor" }]

[[action.triggers]]
name = "factory_janitor"
kind = "wasm"
module = "factory_janitor"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

# -- Re-check clocks -------------------------------------------------------------
#
# A self-loop re-arms a state_timeout only when the action is listed in
# reset_on (kernel: !state_changed && reset_on.contains(action)). Each Check*
# tick therefore re-arms its own 30s clock. The spec language allows exactly
# one state_timeout per state, so the phase time budget is enforced inside
# the modules (tick budget, enforced against a counter in the module's
# sandbox marker file); a module that fails hard fails its trigger and the
# kernel dispatches ExpireTask via on_failure.

[[state_timeout]]
state = "Planning"
after_seconds = 30
on_timeout = "CheckPlanning"
reset_on = ["CheckPlanning"]

[[state_timeout]]
state = "Implementing"
after_seconds = 30
on_timeout = "CheckImplementing"
reset_on = ["CheckImplementing"]

[[state_timeout]]
state = "Validating"
after_seconds = 30
on_timeout = "CheckValidating"
reset_on = ["CheckValidating"]

[[state_timeout]]
state = "PublishingPR"
after_seconds = 30
on_timeout = "CheckPublishing"
reset_on = ["CheckPublishing"]

[[state_timeout]]
state = "Merging"
after_seconds = 30
on_timeout = "CheckMerging"
reset_on = ["CheckMerging"]

[[state_timeout]]
state = "Observing"
after_seconds = 30
on_timeout = "CheckObserving"
reset_on = ["CheckObserving"]

[[state_timeout]]
state = "FinalizingMerge"
after_seconds = 30
on_timeout = "CheckFinalizing"
reset_on = ["CheckFinalizing"]

# -- Invariants -------------------------------------------------------------------

[[invariant]]
name = "CompletedIsFinal"
when = ["Completed"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"
