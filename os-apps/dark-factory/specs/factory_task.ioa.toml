# Dark Factory — FactoryTask
#
# One task that an agent plans, implements, validates, publishes, merges, and
# observes on a paw-compute Computer, with two human gates (plan approval and
# merge approval) and bounded repair loops. Ported from the external
# den-software-factory demo app (same fencing contract; 12 states after
# ADR-0067 D7 added FinalizingMerge), with these deliberate changes:
#
#   1. `sandbox_id` is gone. The task attaches 1:1 to a paw-compute Computer
#      (`computer_id`); the Computer row holds the sandbox identity.
#   2. The external Node controller is gone. Work is driven by WASM modules
#      (factory_planner / factory_implementer / factory_validator /
#      factory_publisher / factory_janitor) wired to pollable re-check
#      actions: each working state re-fires its Check* action every 30s
#      (state_timeout + reset_on self-loop — the spec language allows only
#      one state_timeout per state, so the phase budget is enforced by the
#      modules: each counts its ticks and reports ExpireTask at the bound —
#      130 ticks (65 min) for Planning/Implementing, the Pi run budget per
#      GB 2026-09-16; 60 for Validating/Observing; 30 for PublishingPR/
#      Merging/FinalizingMerge). A permanently broken module fails its trigger and the
#      kernel dispatches ExpireTask via on_failure.
#   3. `base_sha` moves from StartPlanning to SubmitPlan: the planner
#      resolves the base commit during checkout (GitHub API or clone HEAD)
#      and freezes it with the plan it submits.
#
# Fencing contract (unchanged from the den demo):
#   - operation_key / operation_owner identify the active operation.
#     External phase-entry actions (StartPlanning, ApprovePlan, RejectPlan,
#     ApproveMerge, RequestChanges) take them as parameters from the caller;
#     module-reported transitions mint a fresh pair for the next phase.
#   - Completion actions must pass expected_operation_key /
#     expected_operation_owner equal to the stored fields (spec-level
#     fencing against stale reporters).
#   - plan_digest binds ApprovePlan to the exact submitted plan;
#     head_sha binds ApproveMerge to the exact reviewed head.

[automaton]
name = "FactoryTask"
states = [
  "Requested",
  "Planning",
  "AwaitingPlanApproval",
  "Implementing",
  "Validating",
  "PublishingPR",
  "AwaitingMergeApproval",
  "Merging",
  "Observing",
  "FinalizingMerge",
  "Completed",
  "Failed",
]
initial = "Requested"
strict_action_params = true

# ADR-0050 liveness coverage. Working states carry [[state_timeout]]
# declarations below (re-check cadence + module-side phase budgets).
# The entry state and the human-review gates legitimately wait forever:
# nothing moves until an operator (or the console, on their behalf) acts.
allow_indefinite_states = [
  "Requested",
  "AwaitingPlanApproval",
  "AwaitingMergeApproval",
]

# -- State variables ----------------------------------------------------------

[[state]]
name = "task_prompt"
type = "string"
initial = ""

[[state]]
name = "factory_id"
type = "string"
initial = ""

[[state]]
name = "computer_id"
type = "string"
initial = ""

[[state]]
name = "base_sha"
type = "string"
initial = ""

[[state]]
name = "plan_text"
type = "string"
initial = ""

[[state]]
name = "plan_digest"
type = "string"
initial = ""

[[state]]
name = "repair_context"
type = "string"
initial = ""

[[state]]
name = "branch_name"
type = "string"
initial = ""

[[state]]
name = "head_sha"
type = "string"
initial = ""

[[state]]
name = "published_sha"
type = "string"
initial = ""

[[state]]
name = "validation_summary"
type = "string"
initial = ""

[[state]]
name = "pull_request_url"
type = "string"
initial = ""

[[state]]
name = "merge_sha"
type = "string"
initial = ""

# The real GitHub merge commit SHA, recorded by MergeFinalized after
# observation passes (ADR-0067 D7: observe-before-merge). Distinct from
# merge_sha, which is the deployed/observed head recorded by RecordMerged.
[[state]]
name = "merge_commit_sha"
type = "string"
initial = ""

[[state]]
name = "observation_summary"
type = "string"
initial = ""

[[state]]
name = "operation_key"
type = "string"
initial = ""

[[state]]
name = "operation_owner"
type = "string"
initial = ""

[[state]]
name = "operation_result"
type = "string"
initial = ""

[[state]]
name = "repair_round"
type = "counter"
initial = "0"

[[state]]
name = "phase_ticks"
type = "counter"
initial = "0"

[[state]]
name = "failure_reason"
type = "string"
initial = ""

# -- Phase 1: Planning ---------------------------------------------------------

[[action]]
name = "StartPlanning"
kind = "input"
from = ["Requested"]
to = "Planning"
params = ["task_prompt", "factory_id", "computer_id", "operation_key", "operation_owner", "phase_ticks"]
hint = "Record the request and let factory_planner produce a plan on a Computer. computer_id may name an existing Ready computer to reuse; empty means the planner creates one."
effect = [{ type = "set_counter_from_param", var = "phase_ticks", param = "phase_ticks" }]

[[action.constraints]]
kind = "param_nonempty"
param = "task_prompt"

[[action.constraints]]
kind = "param_nonempty"
param = "operation_key"

[[action.constraints]]
kind = "param_nonempty"
param = "operation_owner"

[[action]]
name = "CheckPlanning"
kind = "input"
from = ["Planning"]
to = "Planning"
hint = "Re-check tick for the planning phase (factory_planner). Self-loop re-arms the 30s timeout via reset_on; a not-done tick reports success with an empty callback action."
effect = [
  { type = "trigger", name = "factory_planner" },
  { type = "increment", var = "phase_ticks" },
]

[[action.triggers]]
name = "factory_planner"
kind = "wasm"
module = "factory_planner"
on_failure = "ExpireTask"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"
modal_bridge_url = "{secret:modal_bridge_url}"
github_token = "{secret:github_token}"
model_api_key = "{secret:anthropic_api_key}"
pi_provider = "anthropic"
pi_model = "claude-sonnet-4-6"

[[action]]
name = "AttachComputer"
kind = "input"
from = ["Planning"]
to = "Planning"
params = ["computer_id", "operation_result", "expected_operation_key", "expected_operation_owner"]
hint = "Bind the planner-provisioned Computer to this task (CAS-fenced). After attachment the planner proceeds to checkout on the next tick."

[[action.constraints]]
kind = "param_nonempty"
param = "computer_id"

[[action.constraints]]
kind = "param_equals_field"
param = "expected_operation_key"
field = "operation_key"

[[action.constraints]]
kind = "param_equals_field"
param = "expected_operation_owner"
field = "operation_owner"

[[action]]
name = "SubmitPlan"
kind = "input"
from = ["Planning"]
to = "AwaitingPlanApproval"
params = [
  "plan_text",
  "plan_digest",
  "base_sha",
  "operation_result",
  "expected_operation_key",
  "expected_operation_owner",
]
hint = "Submit the exact plan for the first human decision, freezing the base commit the plan was computed against."

[[action.constraints]]
kind = "param_nonempty"
param = "plan_text"

[[action.constraints]]
kind = "param_nonempty"
param = "plan_digest"

[[action.constraints]]
kind = "param_nonempty"
param = "base_sha"

[[action.constraints]]
kind = "param_equals_field"
param = "expected_operation_key"
field = "operation_key"

[[action.constraints]]
kind = "param_equals_field"
param = "expected_operation_owner"
field = "operation_owner"

[[action]]
name = "ApprovePlan"
kind = "input"
from = ["AwaitingPlanApproval"]
to = "Implementing"
params = ["plan_digest", "operation_key", "operation_owner", "phase_ticks"]
hint = "Approve only the currently submitted plan digest."
effect = [{ type = "set_counter_from_param", var = "phase_ticks", param = "phase_ticks" }]

[[action.constraints]]
kind = "param_equals_field"
param = "plan_digest"
field = "plan_digest"

[[action.constraints]]
kind = "param_nonempty"
param = "operation_key"

[[action.constraints]]
kind = "param_nonempty"
param = "operation_owner"

[[action]]
name = "RejectPlan"
kind = "input"
from = ["AwaitingPlanApproval"]
to = "Planning"
params = ["repair_context", "plan_digest", "operation_key", "operation_owner", "phase_ticks"]
effect = [{ type = "increment", var = "repair_round" }, { type = "set_counter_from_param", var = "phase_ticks", param = "phase_ticks" }]
hint = "Return human feedback to the planning agent."

[[action.constraints]]
kind = "param_nonempty"
param = "repair_context"

[[action.constraints]]
kind = "param_equals_field"
param = "plan_digest"
field = "plan_digest"

[[action.constraints]]
