# Computer — Persistent cloud VM for developer agents.
#
# A Computer represents a long-lived Linux VM (e.g., Fly.io Sprite)
# that an agent uses as its development environment. The VM persists
# across agent runs — code, dependencies, and state survive restarts.
#
# Lifecycle: Created → Provisioning → Ready ↔ Sleeping → Destroyed
#            Ready → Checkpointing → Ready (checkpoint in place)

[automaton]
name = "Computer"
states = ["Created", "Provisioning", "Ready", "Checkpointing", "Sleeping", "Destroyed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
# Provisioning is tick-driven: state_timeout re-fires CheckProvision every
# 30s until the sandbox is healthy (bounded by the module's tick budget).
allow_indefinite_states = ["Created", "Ready", "Checkpointing", "Sleeping"]

[[state_timeout]]
state = "Provisioning"
after_seconds = 30
on_timeout = "CheckProvision"
reset_on = ["ProvisionCreated", "ProvisionPoll"]

# -- State variables ----------------------------------------------------------

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "provider"
type = "string"
initial = "tensorlake"

[[state]]
name = "machine_id"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[state]]
name = "ssh_host"
type = "string"
initial = ""

[[state]]
name = "cpu_cores"
type = "string"
initial = "2"

[[state]]
name = "memory_gb"
type = "string"
initial = "4"

[[state]]
name = "storage_gb"
type = "string"
initial = "100"

[[state]]
name = "base_image"
type = "string"
initial = "ubuntu-24.04"

[[state]]
name = "setup_script"
type = "string"
initial = ""

[[state]]
name = "last_checkpoint_at"
type = "string"
initial = ""

[[state]]
name = "provisioned_at"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# -- Governance fields --------------------------------------------------------

[[state]]
name = "tools_installed"
type = "string"
initial = ""

[[state]]
name = "credentials_scoped"
type = "string"
initial = ""

[[state]]
name = "network_allow"
type = "string"
initial = ""

[[state]]
name = "project_harness_id"
type = "string"
initial = ""

# -- Actions -------------------------------------------------------------------

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
to = "Created"
params = ["name", "description", "provider", "cpu_cores", "memory_gb", "storage_gb", "base_image", "setup_script", "tools_installed", "credentials_scoped", "network_allow", "project_harness_id"]
hint = "Set up the computer specification before provisioning."

[[state]]
name = "provision_ticks"
type = "counter"
initial = "0"

[[action]]
name = "Provision"
kind = "input"
from = ["Created"]
to = "Provisioning"
hint = "Start provisioning the VM."
effect = [{ type = "trigger", name = "computer_provision" }]

[[action.triggers]]
name = "computer_provision"
kind = "wasm"
module = "computer_provision"
on_failure = "ProvisionFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"
modal_bridge_url = "{secret:modal_bridge_url}"

[[action]]
name = "ProvisionCreated"
kind = "input"
from = ["Provisioning"]
to = "Provisioning"
params = ["machine_id", "sandbox_url", "provision_ticks"]
hint = "Record the fresh sandbox handle; health polling continues on ticks."
effect = [{ type = "set_counter_from_param", var = "provision_ticks", param = "provision_ticks" }]

[[action]]
name = "CheckProvision"
kind = "internal"
from = ["Provisioning"]
to = "Provisioning"
hint = "Poll sandbox health; run setup on first health, then complete."
effect = [{ type = "trigger", name = "computer_provision" }]

[[action.triggers]]
name = "computer_provision"
kind = "wasm"
module = "computer_provision"
on_failure = "ProvisionFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"
modal_bridge_url = "{secret:modal_bridge_url}"

[[action]]
name = "ProvisionPoll"
kind = "input"
from = ["Provisioning"]
to = "Provisioning"
params = ["provision_ticks"]
hint = "Sandbox not healthy yet; re-arm the next poll tick."
effect = [{ type = "set_counter_from_param", var = "provision_ticks", param = "provision_ticks" }]

[[action]]
name = "ProvisionComplete"
kind = "input"
from = ["Provisioning"]
to = "Ready"
params = ["machine_id", "sandbox_url", "ssh_host"]
hint = "Record the provisioned VM details."

[[action]]
name = "ProvisionFailed"
kind = "input"
from = ["Provisioning"]
to = "Created"
params = ["error_message"]
hint = "Record a provisioning failure."

[[action]]
name = "Checkpoint"
kind = "input"
from = ["Ready"]
to = "Checkpointing"
hint = "Start a checkpoint of the VM state."

[[action]]
name = "CheckpointComplete"
kind = "input"
from = ["Checkpointing"]
to = "Ready"
hint = "Checkpoint completed."

[[action]]
name = "Sleep"
kind = "input"
from = ["Ready"]
to = "Sleeping"
hint = "Put the VM to sleep."

[[action]]
name = "Wake"
kind = "input"
from = ["Sleeping"]
to = "Provisioning"
hint = "Wake the VM from sleep."
effect = [{ type = "trigger", name = "computer_provision" }]

[[action.triggers]]
name = "computer_provision"
kind = "wasm"
module = "computer_provision"
on_failure = "ProvisionFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"
modal_bridge_url = "{secret:modal_bridge_url}"

[[action]]
name = "Destroy"
kind = "input"
from = ["Ready", "Sleeping", "Created"]
to = "Destroyed"
hint = "Permanently destroy the VM."
effect = [{ type = "trigger", name = "computer_terminate" }]

# Destroy is terminal, so the module always reports an empty callback; the
# sandbox deletion is best-effort cleanup (failures are logged, never block).
[[action.triggers]]
name = "computer_terminate"
kind = "wasm"
module = "computer_terminate"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"
modal_bridge_url = "{secret:modal_bridge_url}"

[[invariant]]
name = "DestroyedIsFinal"
when = ["Destroyed"]
assert = "no_further_transitions"
