# Exec — one governed shell command on a Computer's sandbox.
#
# Third-party harnesses execute commands on a Computer through this entity
# instead of talking to the sandbox provider directly. Every invocation is
# Cedar-gated at Run, and the full record — command, exit code, output
# tails — persists on the row as the audit trail.
#
# Lifecycle: Created → Running → Succeeded | Failed

[automaton]
name = "Exec"
states = ["Created", "Running", "Succeeded", "Failed"]
initial = "Created"

# Created waits for Run; Running is bounded by the computer_exec trigger
# itself (the sandbox exec polls with a hard cap and reports back via
# RunSucceeded or RunFailed). While Running, a 5s CheckOutput self-loop
# (ADR-0005) streams in-flight output tails onto the row — Running
# therefore has liveness coverage and is not listed allow-indefinite.
allow_indefinite_states = ["Created"]

# -- State variables ----------------------------------------------------------

[[state]]
name = "computer_id"
type = "string"
initial = ""

[[state]]
name = "command"
type = "string"
initial = ""

[[state]]
name = "exit_code"
type = "string"
initial = ""

[[state]]
name = "stdout_tail"
type = "string"
initial = ""

[[state]]
name = "stderr_tail"
type = "string"
initial = ""

# Path to the per-exec log file on the sandbox holding the FULL combined
# output, and its total byte count — so output larger than the tail can be
# paged via follow-up Execs (grep/sed/tail on stdout_path).
[[state]]
name = "stdout_path"
type = "string"
initial = ""

[[state]]
name = "stdout_bytes"
type = "string"
initial = ""

[[state]]
name = "error"
type = "string"
initial = ""

[[state]]
name = "created_by"
type = "string"
initial = ""

# -- Actions -------------------------------------------------------------------

[[action]]
name = "Run"
kind = "input"
from = ["Created"]
to = "Running"
params = ["computer_id", "command", "created_by"]
hint = "Execute the command on the named computer's sandbox. The computer must be provisioned (Ready) with a recorded sandbox_url."
effect = [{ type = "trigger", name = "computer_exec" }]

[[action.triggers]]
name = "computer_exec"
kind = "wasm"
module = "computer_exec"
on_failure = "RunFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"
modal_bridge_url = "{secret:modal_bridge_url}"

[[action]]
name = "RunSucceeded"
kind = "input"
from = ["Running"]
to = "Succeeded"
params = ["exit_code", "stdout_tail", "stderr_tail", "stdout_path", "stdout_bytes"]
hint = "Callback from computer_exec — the command finished; record exit code, truncated output tail, and the full-output log path/size."

[[action]]
name = "RunFailed"
kind = "input"
from = ["Running"]
to = "Failed"
params = ["error"]
hint = "Callback from computer_exec — execution failed before producing an exit code."

# -- In-flight output streaming (ADR-0005) -------------------------------------

[[action]]
name = "CheckOutput"
kind = "input"
from = ["Running"]
to = "Running"
hint = "Re-check tick for in-flight output (computer_exec_tail). Self-loop re-arms the 5s timeout via reset_on; a not-yet-readable log reports success with an empty callback action."
effect = [{ type = "trigger", name = "computer_exec_tail" }]

[[action.triggers]]
name = "computer_exec_tail"
kind = "wasm"
module = "computer_exec_tail"
# No on_failure by design: a tailing failure must never kill the run. The
# module never errors — every failure path degrades to the empty stay
# callback.

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"
modal_bridge_url = "{secret:modal_bridge_url}"

[[action]]
name = "ReportOutput"
kind = "input"
from = ["Running"]
to = "Running"
params = ["stdout_tail", "stdout_bytes"]
hint = "Callback from computer_exec_tail — refresh the output tail and log size mid-run. The final RunSucceeded report remains authoritative (separated streams)."

[[state_timeout]]
state = "Running"
after_seconds = 5
on_timeout = "CheckOutput"
reset_on = ["CheckOutput"]

[[invariant]]
name = "SucceededIsFinal"
when = ["Succeeded"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"
