name = "paw-compute"
description = "Compute provisioning for agent sandboxes via Fly.io"
version = "0.1.0"
startup_install = "core"
dependencies = []

[[wasm_modules]]
name = "computer_exec"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "computer_exec_tail"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "computer_provision"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "computer_terminate"
criticality = "app-required"
startup_loading = "lazy"
